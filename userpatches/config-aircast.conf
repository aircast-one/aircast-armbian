RELEASE=trixie
BRANCH=current
KERNELBRANCH=tag:v6.18.33
BUILD_MINIMAL=no
BUILD_DESKTOP=no
KERNEL_CONFIGURE=no
INSTALL_HEADERS=yes
HOST=aircast
BOOTFS_TYPE=fat
BOOT_FS_LABEL=bootfs
ROOT_FS_LABEL=rootfs
FIRST_USER_NAME=pi
FIRST_USER_PASS=raspberry
WPA_COUNTRY=GE

enable_extension "cloud-init"

function extension_prepare_config__aircast_packages() {
	add_packages_to_image avahi-daemon usb-modeswitch v4l-utils ethtool linux-sysctl-defaults
}

function extension_prepare_config__aircast_extlinux_regdom() {
	[[ "${SRC_EXTLINUX}" == "yes" ]] || return 0
	declare -g SRC_CMDLINE="${SRC_CMDLINE} cfg80211.ieee80211_regdom=${WPA_COUNTRY}"
}

function on_chroot() {
	env -u TMPDIR -u SUDO_USER LC_ALL=C chroot "${ROOTFS_DIR}" /bin/bash -e "$@"
}

function aircast_run_pi_gen_stage() {
	declare dir n packages
	for dir in "${1}"/*/; do
		for n in {00..99}; do
			if [[ -e "${dir}${n}-patches" ]]; then
				exit_with_error "aircast: quilt patches are not supported" "${dir}${n}-patches"
			fi
			if [[ -f "${dir}${n}-debconf" ]]; then
				on_chroot -c debconf-set-selections < "${dir}${n}-debconf"
			fi
			if [[ -f "${dir}${n}-packages-nr" ]]; then
				packages="$(sed 's/#.*//' "${dir}${n}-packages-nr" | xargs)"
				on_chroot -c "apt-get -o Acquire::Retries=3 install -y --no-install-recommends ${packages}"
			fi
			if [[ -f "${dir}${n}-packages" ]]; then
				packages="$(sed 's/#.*//' "${dir}${n}-packages" | xargs)"
				on_chroot -c "apt-get -o Acquire::Retries=3 -o APT::Install-Recommends=true install -y ${packages}"
			fi
			if [[ -x "${dir}${n}-run.sh" ]]; then
				display_alert "aircast: pi-gen" "${dir#"${1}"/}${n}-run.sh" "info"
				(cd "${dir}" && "./${n}-run.sh")
			fi
			if [[ -f "${dir}${n}-run-chroot.sh" ]]; then
				on_chroot < "${dir}${n}-run-chroot.sh"
			fi
		done
	done
}

function post_customize_image__aircast() {
	declare pi_gen="${USERPATCHES_PATH}/aircast-pi-gen"
	[[ -d "${pi_gen}/stage3" ]] || exit_with_error "aircast: ${pi_gen}/stage3 missing" "build with ./build.sh"

	chroot_sdcard "for g in adm dialout cdrom audio users sudo video games plugdev input gpio spi i2c netdev render; do groupadd -f -r \$g; done"
	chroot_sdcard "useradd -m -s /bin/bash -G adm,dialout,cdrom,audio,users,sudo,video,games,plugdev,input,gpio,spi,i2c,netdev,render ${FIRST_USER_NAME} && rm -rf /home/${FIRST_USER_NAME}/.oh-my-zsh"
	chroot_sdcard "echo '${FIRST_USER_NAME}:${FIRST_USER_PASS}' | chpasswd"
	chroot_sdcard "usermod --pass='*' root"

	export ROOTFS_DIR="${SDCARD}" FIRST_USER_NAME AIRCAST_DISTRIBUTION AIRCAST_APT_CHANNEL AIRCASTD_VERSION IMAGE_VERSION PI_GEN_REF PI_GEN_COMMIT
	export -f on_chroot
	on_chroot -c "apt-get -o Acquire::Retries=3 update"
	aircast_run_pi_gen_stage "${pi_gen}/stage3"

	install -m 755 "${pi_gen}"/stage2/04-cloud-init/files/* "${SDCARD}/boot/"
	sed -i 's/fs_label: armbi_boot/fs_label: bootfs/' "${SDCARD}/etc/cloud/cloud.cfg.d/99-fake_cloud.cfg"
	grep -q 'fs_label: bootfs' "${SDCARD}/etc/cloud/cloud.cfg.d/99-fake_cloud.cfg"

	declare env_txt="${SDCARD}/boot/armbianEnv.txt"
	if [[ "${SRC_EXTLINUX}" != "yes" ]]; then
		if grep -q '^extraargs=' "${env_txt}"; then
			sed -i "s/^extraargs=.*/& cfg80211.ieee80211_regdom=${WPA_COUNTRY}/" "${env_txt}"
		else
			echo "extraargs=cfg80211.ieee80211_regdom=${WPA_COUNTRY}" >> "${env_txt}"
		fi
	fi

	sed -i 's/^ENABLED=.*/ENABLED=false/' "${SDCARD}/etc/default/armbian-ramlog"

	install -d "${SDCARD}/boot/firmware"
	cat > "${SDCARD}/etc/systemd/system/boot-firmware.mount" <<- 'EOF'
		[Unit]
		Description=Boot partition at the Raspberry Pi path aircastd reads
		RequiresMountsFor=/boot

		[Mount]
		What=/boot
		Where=/boot/firmware
		Options=bind

		[Install]
		WantedBy=local-fs.target
	EOF
	chroot_sdcard "systemctl enable boot-firmware.mount"
	chroot_sdcard "systemctl disable armbian-resize-filesystem.service"
}
